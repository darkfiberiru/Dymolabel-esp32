[env:esp32_s3_supermini]
platform = espressif32
board = esp32_s3_supermini
framework = arduino

; Override board settings for proper 4MB flash partition
; Using min_spiffs for larger app partitions (1.875MB each) to accommodate BLE provisioning
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_FREERTOS_HZ=1000
    ; Increase stack size for image processing
    -DARDUINO_LOOP_STACK_SIZE=8192
    ; Enable USB Host support
    -DUSE_ESP_IDF_USB_HOST=1
    ; Disable QR code in WiFiProv to avoid missing dependencies
    -DWIFI_PROV_QR_VERSION=""

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps =
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1
    ricmoo/QRCode@^0.0.1

; Upload settings
upload_speed = 921600
